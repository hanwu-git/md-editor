<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
  <title>MD编辑器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 标题栏（应用内自绘，替代系统标题栏以实现主题统一） -->
  <div id="titlebar">
    <svg width="16" height="16" viewBox="0 0 16 16" style="flex:none;"><rect x="1" y="1" width="14" height="14" rx="3" fill="#8ab4f8"/><path d="M4.2 11V5.4h.1L7.3 9.1l3-3.7h.1V11h1V4.6h-1.2L7.3 8.4l-2.9-3.8H3.2V11z" fill="#0d1b3e"/></svg>
    <span id="title-text">MD编辑器 v1.0.0</span>
    <div id="titlebar-actions">
      <button id="theme-toggle" title="切换明暗主题">
        <span id="theme-icon"></span>
        <span id="theme-label">浅色</span>
      </button>
      <span class="tb-btn" id="min-btn">&#x2013;</span>
      <span class="tb-btn" id="max-btn">&#x2610;</span>
      <span class="tb-btn tb-close" id="close-btn">&#x2715;</span>
    </div>
  </div>

  <!-- 菜单栏 -->
  <div id="menubar"></div>

  <!-- 标签栏：多文档切换 -->
  <div id="tabbar"></div>

  <!-- 主区域：分屏 -->
  <div id="workspace">
    <!-- 左侧：编辑区 -->
    <div id="left-pane">
      <div class="pane-header">
        <span class="dot"></span>
        <span id="file-name">未命名</span>
        <span id="dirty-label" class="muted">未保存修改</span>
        <span class="spacer"></span>
        <span id="left-tag" class="muted tag">Markdown</span>
      </div>
      <div id="editor-wrap">
        <div id="line-nums"></div>
        <textarea id="editor" spellcheck="false" placeholder="# 开始输入 Markdown 内容…"></textarea>
      </div>
    </div>

    <!-- 分隔条 -->
    <div id="divider"></div>

    <!-- 右侧：预览区 -->
    <div id="right-pane">
      <div class="pane-header">
        <span class="dot dot-blue"></span>
        <span>实时预览</span>
        <span class="spacer"></span>
        <span id="render-time" class="muted"></span>
      </div>
      <div id="preview"></div>
    </div>
  </div>

  <!-- 查找 / 替换条 -->
  <div id="searchbar" class="hidden">
    <div id="search-row">
      <input id="search-input" type="text" placeholder="查找…" />
      <button id="search-case" title="区分大小写">Aa</button>
      <span id="search-count"></span>
      <button id="search-prev" title="上一个 (Shift+Enter)">↑</button>
      <button id="search-next" title="下一个 (Enter)">↓</button>
      <button id="search-close" title="关闭 (Esc)">✕</button>
    </div>
    <div id="replace-row" class="hidden">
      <input id="replace-input" type="text" placeholder="替换为…" />
      <span class="search-spacer"></span>
      <button id="replace-one">替换</button>
      <button id="replace-all">全部替换</button>
    </div>
  </div>

  <!-- 状态栏 -->
  <div id="statusbar">
    <span id="status-encoding">UTF-8</span>
    <span id="status-cursor">第 1 行 · 第 1 列 · 0 字符</span>
    <span class="spacer"></span>
    <span id="status-dirty">已保存</span>
    <span id="status-render"></span>
  </div>

  <!-- 未保存确认浮层 -->
  <div id="save-confirm-overlay" class="hidden">
    <div class="confirm-box">
      <div class="confirm-icon">!</div>
      <p id="confirm-title">是否保存对文件的更改？</p>
      <p id="confirm-detail">您的更改将丢失，如果选择"不保存"。</p>
      <div class="confirm-buttons">
        <button data-confirm="save">保存</button>
        <button data-confirm="nosave">不保存</button>
        <button data-confirm="cancel" class="primary">取消</button>
      </div>
    </div>
  </div>

  <!-- 依赖加载：marked 本地同步（44KB）；mermaid/highlight 由 lazy-loader 按需注入（本地 vendor 优先，CDN 兜底） -->
  <script src="lazy-loader.js"></script>
  <script src="vendor/marked.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
